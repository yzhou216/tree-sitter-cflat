[package]
name = "tree-sitter-cflat"
description = "C♭ grammar for tree-sitter"
version = "0.1.0"
authors = ["Yiyu Zhou <yzhou155@dons.usfca.edu>"]
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "cflat"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/yzhou216/tree-sitter-cflat"
edition = "2024"
rust-version = "1.90"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "cflat.cfg",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSES/*",
  "/README.md",
  "/REUSE.toml",
  # The example targets declared below ship as part of the package, so their
  # sources have to be included or `cargo package` produces a crate that
  # cannot build.
  "examples/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.11"

[[example]]
name = "tokens"
path = "examples/tokens.rs"

[[example]]
name = "lint"
path = "examples/lint.rs"
test = true

[[example]]
name = "parse-check"
path = "examples/parse-check.rs"
test = true
